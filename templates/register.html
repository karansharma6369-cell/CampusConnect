<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CampusConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Create CampusConnect Account 🎓</h1>

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >

        <br><br>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

</body>

</html>
