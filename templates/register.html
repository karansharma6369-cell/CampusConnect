<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - CampusConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(79, 125, 243, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(139, 156, 246, 0.18),
                    transparent 35%
                ),
                #f5f7fc;

            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 450px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.96);

            border: 1px solid rgba(79, 125, 243, 0.10);

            border-radius: 24px;

            padding: 38px 34px 34px;

            box-shadow:
                0 20px 50px rgba(30, 50, 90, 0.10),
                0 4px 15px rgba(30, 50, 90, 0.05);

            animation: cardAppear 0.5s ease;
        }

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 64px;
            height: 64px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #4f7df3,
                    #8b9cf6
                );

            font-size: 31px;

            box-shadow:
                0 10px 25px rgba(79, 125, 243, 0.25);
        }

        .brand h1 {
            margin: 0;

            font-size: 28px;
            font-weight: 750;

            letter-spacing: -0.6px;

            color: #1f2a44;
        }

        .brand p {
            margin: 7px 0 0;

            font-size: 14px;

            color: #7a8499;
        }

        .register-title {
            margin-bottom: 22px;
        }

        .register-title h2 {
            margin: 0;

            font-size: 22px;

            color: #202b43;
        }

        .register-title p {
            margin: 6px 0 0;

            font-size: 13px;

            color: #8a93a6;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 600;

            color: #46516a;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 16px;

            opacity: 0.65;

            pointer-events: none;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px 13px 42px;

            border: 1px solid #e1e6f0;

            border-radius: 12px;

            outline: none;

            background: #f9faff;

            color: #26324b;

            font-size: 14px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .form-group input::placeholder {
            color: #a3aabd;
        }

        .form-group input:focus {
            background: white;

            border-color: #6d8ff5;

            box-shadow:
                0 0 0 4px rgba(79, 125, 243, 0.10);
        }

        .register-button {
            width: 100%;

            margin-top: 6px;

            padding: 14px;

            border: none;
            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #4f7df3,
                    #6d8ff5
                );

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(79, 125, 243, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .register-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(79, 125, 243, 0.28);
        }

        .register-button:active {
            transform: translateY(0);
        }

        .login-text {
            text-align: center;

            margin: 22px 0 0;

            font-size: 13px;

            color: #858ea2;
        }

        .login-text a {
            color: #4f7df3;

            font-weight: 700;

            text-decoration: none;

            transition: color 0.2s ease;
        }

        .login-text a:hover {
            color: #315fcf;
        }

        .footer-text {
            text-align: center;

            margin-top: 18px;

            font-size: 11px;

            color: #a3aabd;
        }

        @media (max-width: 480px) {

            body {
                padding: 16px;
            }

            .register-card {
                padding: 30px 22px 27px;

                border-radius: 20px;
            }

            .brand h1 {
                font-size: 25px;
            }

            .logo {
                width: 58px;
                height: 58px;

                font-size: 28px;
            }

        }

    </style>

</head>


<body>

    <div class="register-container">

        <div class="register-card">

            <!-- BRAND -->

            <div class="brand">

                <div class="logo">
                    🎓
                </div>

                <h1>
                    CampusConnect
                </h1>

                <p>
                    Connect. Communicate. Belong.
                </p>

            </div>


            <!-- REGISTER TITLE -->

            <div class="register-title">

                <h2>
                    Create your account 🚀
                </h2>

                <p>
                    Join your campus community today
                </p>

            </div>
                {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}

            <!-- REGISTER FORM -->

            <form method="POST">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✉️
                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="register-button"
                >
                    Create CampusConnect Account
                </button>

            </form>


            <!-- LOGIN -->

            <p class="login-text">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login
                </a>

            </p>

        </div>


        <div class="footer-text">
            CampusConnect • Your college, your community
        </div>

    </div>

</body>

</html>
